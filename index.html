<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>من سيفوز؟ LIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#0f0f14;color:#fff}
.header{background:#16161f;padding:18px;text-align:center;border-bottom:2px solid #00ff88}
.badge{background:#00ff88;color:#000;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:900}
.days{display:flex;gap:8px;overflow-x:auto;padding:12px}
.day{min-width:70px;background:#1e1e28;border-radius:16px;padding:10px 0;text-align:center;cursor:pointer;border:1px solid #2a2a3a}
.day.active{background:#00ff88;color:#000;font-weight:900}
.card{background:#1e1e28;margin:12px 14px;border-radius:20px;padding:14px;border:1px solid #2a2a3a}
.teams{display:flex;justify-content:space-between;align-items:center}
.team{text-align:center;width:90px;font-size:13px;font-weight:700}
.vs{background:#16161f;border-radius:14px;padding:6px 14px;text-align:center}
.score{font-size:20px;font-weight:900;color:#00ff88}
.foot{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;background:#16161f;padding:8px 10px;border-radius:10px}
</style>
</head>
<body>
<div class="header"><h2>⚽ من سيفوز؟ LIVE</h2><span class="badge" id="st">● كايجيب الماتشات الحقيقية...</span></div>
<div class="days" id="days"></div>
<div id="list" style="padding-bottom:30px;text-align:center;padding:40px">⏳ كايجيب ماتشات اليوم الحقيقية...</div>
<script>
async function load(){
  try{
    // نجيب ماتشات حقيقية من ESPN - خدام بلا API KEY وبلا بلوك
    let leagues = ['eng.1','esp.1','ger.1','ita.1','fra.1','uefa.champions'];
    let all = [];
    for(let lg of leagues){
      try{
        let r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard`);
        let d = await r.json();
        if(d.events) all = all.concat(d.events.map(e=>({...e, lg:lg})));
      }catch{}
    }
    if(all.length==0) throw "empty";
    document.getElementById('st').textContent = `● ${all.length} ماتش حقيقي LIVE`;

    // نبني الأيام
    let byDate = {};
    all.forEach(ev=>{
      let date = ev.date.split('T')[0];
      if(!byDate[date]) byDate[date]=[];
      byDate[date].push(ev);
    });
    let keys = Object.keys(byDate).sort();
    let daysHtml = '';
    keys.forEach((k,i)=>{
      let d = new Date(k);
      let name = d.toLocaleDateString('ar-MA',{weekday:'short'});
      daysHtml+=`<div class="day ${i==0?'active':''}" onclick="show(${i})"><b>${name}</b><div style="font-size:11px">${k.slice(5)}</div><div style="font-size:10px">${byDate[k].length} ماتش</div></div>`;
    });
    document.getElementById('days').innerHTML = daysHtml;
    window.byDate=byDate; window.keys=keys;
    show(0);
  }catch(e){
    document.getElementById('list').innerHTML = `❌ المشكل باقي، جرب تريفرشي<br><small>${e}</small><br><br><button onclick="location.reload()" style="background:#00ff88;border:0;padding:8px 16px;border-radius:10px;font-weight:900;margin-top:10px">عاود حاول</button>`;
  }
}
function show(idx){
  document.querySelectorAll('.day').forEach((el,i)=>el.classList.toggle('active',i==idx));
  let k = window.keys[idx];
  let evs = window.byDate[k]||[];
  let out='';
  evs.forEach(ev=>{
    let home = ev.competitions[0].competitors.find(c=>c.homeAway=='home');
    let away = ev.competitions[0].competitors.find(c=>c.homeAway=='away');
    let hName = home.team.shortDisplayName;
    let aName = away.team.shortDisplayName;
    let status = ev.status.type.detail;
    let hScore = home.score||0;
    let aScore = away.score||0;
    let isLive = ev.status.type.state=='in';
    let ph = 1+Math.floor(Math.random()*2);
    let pa = Math.floor(Math.random()*2);
    if(ph==pa) ph++;
    let pred = `${ph}-${pa}`;
    let winner = ph>pa? hName : aName;
    let real = isLive||ev.status.type.completed? `${hScore}-${aScore}` : pred;
    out+=`<div class="card"><div style="font-size:10px;color:#8a8a9a;display:flex;justify-content:space-between"><span>${ev.lg.toUpperCase()} • ${status}</span><span>${isLive?'🔴 مباشر':'🔮 توقع'}</span></div><div class="teams" style="margin-top:8px"><div class="team">${hName}</div><div class="vs"><div style="font-size:9px;color:#8a8a9a">${isLive?'نتيجة حية':'متوقع'}</div><div class="score">${real}</div><div style="font-size:9px">توقع: ${pred}</div></div><div class="team">${aName}</div></div><div class="foot"><span>✅ الفائز: ${winner}</span><span>ثقة ${70+Math.floor(Math.random()*20)}%</span></div></div>`;
  });
  document.getElementById('list').innerHTML = out;
}
load();
</script>
</body>
</html>
