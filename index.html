<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>أكتوبر 2026 - حقيقي 100%</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0e1a;color:#fff}
header{background:#12182b;padding:14px;position:sticky;top:0;z-index:99;border-bottom:2px solid #00ff88}
.day{margin:14px 10px;background:#151d36;border-radius:14px;overflow:hidden;border:1px solid #1e2a4a}
.day-h{background:#1e2c55;padding:10px 14px;font-weight:900;color:#00ff88;display:flex;justify-content:space-between}
.match{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #1e2a4a}
.team{display:flex;align-items:center;gap:8px;width:130px;font-size:13px}
.team img{width:28px;height:28px;background:#fff;border-radius:50%;padding:2px;object-fit:contain}
.mid{text-align:center;min-width:100px}
.badge{font-size:8px;padding:2px 6px;border-radius:4px}
.bn{background:#ff2a2a;color:#fff}.bc{background:#2a3a60;color:#8aa0d0}
</style>
</head>
<body>
<header>
<h3>📅 مباريات أكتوبر 2026 - حقيقية 100% من football-data.org</h3>
<div style="display:flex;gap:6px;margin-top:10px">
<input type="date" id="f" value="2026-10-01" style="flex:1;padding:10px;border-radius:10px;border:none;background:#1e2642;color:#fff">
<input type="date" id="t" value="2026-10-31" style="flex:1;padding:10px;border-radius:10px;border:none;background:#1e2642;color:#fff">
</div>
<button onclick="loadReal()" style="width:100%;margin-top:8px;padding:12px;border-radius:10px;border:none;background:#00ff88;font-weight:900;cursor:pointer">🔄 جيب الحقيقي</button>
<div id="st" style="margin-top:8px;font-size:11px;color:#aaa">API Key: e118...1496da - كايجيب كل المباريات الحقيقية</div>
</header>
<div id="list" style="padding-bottom:30px"></div>

<script>
const API_KEY='e118e70c249349aa9292dce61c1496da';

async function loadReal(){
  let from=document.getElementById('f').value;
  let to=document.getElementById('t').value;
  document.getElementById('list').innerHTML='<div style="padding:40px;text-align:center">⏳ كايجيب المباريات الحقيقية من football-data.org<br>من '+from+' ل '+to+'<br><br>...كايقلب...</div>';
  document.getElementById('st').textContent='⏳ كايجيب...';

  try{
    // الرابط الحقيقي - كايجيب كل المباريات
    let url=`https://api.football-data.org/v4/matches?dateFrom=${from}&dateTo=${to}`;
    // نستعمل proxy اللي كايخلي الـ header يدوز
    let proxyUrl=`https://thingproxy.freeboard.io/fetch/${url}`;
    
    let res=await fetch(proxyUrl,{
      headers:{'X-Auth-Token':API_KEY}
    });
    
    if(!res.ok) throw new Error('API error '+res.status);
    let data=await res.json();
    
    if(!data.matches || data.matches.length==0){
      document.getElementById('list').innerHTML='<div style="padding:20px;text-align:center">ما كاين حتى ماتش فهاد التاريخ فـ football-data.org<br>جرب من 2026-10-10 ل 2026-10-12 (كاينين ماتشات البريميرليغ)</div>';
      return;
    }

    // ترتيب
    data.matches.sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate));
    
    // تجميع كل نهار 10
    let byDay={};
    data.matches.forEach(m=>{
      let d=new Date(m.utcDate).toISOString().split('T')[0];
      if(!byDay[d]) byDay[d]=[];
      if(byDay[d].length<10) byDay[d].push(m);
    });

    let html='';
    let total=0;
    Object.keys(byDay).sort().forEach(d=>{
      let arr=byDay[d];
      total+=arr.length;
      let ds=new Date(d).toLocaleDateString('ar-MA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
      html+=`<div class="day"><div class="day-h"><span>📅 ${ds}</span><span>${arr.length} مباريات</span></div>`;
      arr.forEach(m=>{
        let time=new Date(m.utcDate).toLocaleTimeString('ar-MA',{hour:'2-digit',minute:'2-digit'});
        let isNat=m.competition.code=='WC' || m.competition.code=='EC' || m.competition.name.includes('World') || m.competition.name.includes('Euro');
        // توقع بسيط بناء على الترتيب الحقيقي إلا كاين
        let homeCrest=m.homeTeam.crest || `https://crests.football-data.org/${m.homeTeam.id}.svg`;
        let awayCrest=m.awayTeam.crest || `https://crests.football-data.org/${m.awayTeam.id}.svg`;
        
        html+=`<div class="match">
          <div class="team"><img src="${homeCrest}" onerror="this.style.display='none'"><b>${m.homeTeam.shortName||m.homeTeam.name}</b></div>
          <div class="mid">
            <div><span class="badge ${isNat?'bn':'bc'}">${isNat?'منتخب':m.competition.code}</span> <span style="font-size:10px;color:#888">${time}</span></div>
            <div style="font-size:10px;color:#aaa;margin-top:4px">${m.competition.name}</div>
            <div style="font-size:11px;color:#00ff88;margin-top:2px">مباشر: ${m.status}</div>
          </div>
          <div class="team" style="justify-content:flex-end"><b>${m.awayTeam.shortName||m.awayTeam.name}</b><img src="${awayCrest}" onerror="this.style.display='none'"></div>
        </div>`;
      });
      html+=`</div>`;
    });

    document.getElementById('list').innerHTML=html;
    document.getElementById('st').textContent=`● ${total} مباراة حقيقية (10 لكل يوم) من ${from} ل ${to} - ${data.matches.length} المجموع`;

  }catch(e){
    document.getElementById('list').innerHTML=`<div style="padding:20px;color:#ff6666">❌ خطأ: ${e.message}<br><br>الحل: 1- تأكد أن الـ API Key مزال خدام<br>2- جرب تاريخ قريب: 2026-10-10 ل 2026-10-12<br>3- football-data فالفابور كايعطي غير 10 طلبات فالدقيقة - تسنا دقيقة وعاود</div>`;
    document.getElementById('st').textContent='❌ خطأ - شوف التفاصيل لتحت';
  }
}
loadReal();
</script>
</body>
</html>
