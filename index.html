<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مباريات أكتوبر 2026 - 10 كل يوم + منتخبات</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0e1a;color:#fff}
header{background:#12182b;padding:16px;position:sticky;top:0;z-index:10;border-bottom:2px solid #00ff88}
.filters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.filters input,.filters button{padding:10px;border-radius:10px;border:none}
.filters input{background:#1e2642;color:#fff}
.filters button{background:#00ff88;color:#000;font-weight:900;cursor:pointer}
.day-group{margin:20px 12px}
.day-title{background:#00ff88;color:#000;padding:10px 14px;border-radius:12px;font-weight:900;display:flex;justify-content:space-between}
.card{background:#1a223e;margin:10px 0;border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:space-between;border:1px solid #2a365c}
.team{display:flex;align-items:center;gap:8px;width:115px}
.team img{width:28px;height:28px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}
.team b{font-size:13px}
.vs-col{text-align:center;min-width:90px}
.badge{font-size:9px;padding:3px 6px;border-radius:6px;font-weight:700}
.badge-club{background:#243055;color:#8aa0d0}
.badge-nat{background:#ff3b3b;color:#fff}
.pred{font-size:11px;color:#00ff88;font-weight:800;margin-top:4px}
.score-pred{background:#0f1426;padding:4px 8px;border-radius:8px;font-size:12px;margin-top:4px}
</style>
</head>
<body>
<header>
<h3>📅 مباريات أكتوبر 2026 - كل يوم 10 + منتخبات</h3>
<div class="filters">
<input type="date" id="from" value="2026-10-01">
<input type="date" id="to" value="2026-10-31">
<button onclick="loadOct()">🔄 جيب المباريات</button>
<button onclick="loadToday()" style="background:#fff">اليوم</button>
</div>
<div id="status" style="margin-top:10px;font-size:12px;color:#00ff88">● جاهز</div>
</header>
<div id="list"></div>

<script>
const API_KEY='e118e70c249349aa9292dce61c1496da';
const PROXY='https://thingproxy.freeboard.io/fetch/';

function teamLogo(team){
  if(team.crest) return team.crest;
  return `https://crests.football-data.org/${team.id}.svg`;
}

function isNationalTeam(name){
  let nats=['Morocco','Spain','France','Brazil','Argentina','Germany','Portugal','England','Netherlands','Belgium','Senegal','Egypt','Algeria','Tunisia','Croatia','Uruguay','Colombia','Mexico','USA','Japan'];
  return nats.some(c=>name.includes(c)) || name.length<4;
}

function predictSimple(h,a){
  let hs=h.charCodeAt(0)%10+70;
  let as=a.charCodeAt(0)%10+70;
  let diff=hs-as+ (Math.random()*6-3);
  if(diff>8) return {txt:`فوز ${h}`, score:'2-0', conf:75};
  if(diff>3) return {txt:`فوز ${h}`, score:'2-1', conf:68};
  if(diff>-3) return {txt:'تعادل', score:'1-1', conf:62};
  if(diff>-8) return {txt:`فوز ${a}`, score:'1-2', conf:68};
  return {txt:`فوز ${a}`, score:'0-2', conf:77};
}

async function loadOct(){
  let from=document.getElementById('from').value;
  let to=document.getElementById('to').value;
  document.getElementById('list').innerHTML='<div style="padding:30px;text-align:center">⏳ كايجيب من 1 حتى 31 أكتوبر...<br>المنتخبات + الأندية + اللوغو</div>';
  try{
    let url=`https://api.football-data.org/v4/matches?dateFrom=${from}&dateTo=${to}`;
    let res=await fetch(PROXY+url,{headers:{'X-Auth-Token':API_KEY}});
    let data=await res.json();
    if(!data.matches || data.matches.length==0){
      // جرب ESPN للمنتخبات
      throw new Error('ما كاينش ف football-data، كنجرب ESPN للمنتخبات');
    }
    renderGrouped(data.matches);
    document.getElementById('status').textContent=`● ${data.matches.length} مباراة حقيقية من ${from} ل ${to} - منها منتخبات`;
  }catch(e){
    // fallback: جيب من ESPN للمنتخبات + أندية
    loadESPN(from,to);
  }
}

async function loadESPN(from,to){
  document.getElementById('list').innerHTML='<div style="padding:20px;text-align:center">⏳ كايجيب المنتخبات من ESPN...</div>';
  let leagues=['eng.1','esp.1','fifa.worldq','uefa.nations','fifa.friendly'];
  let all=[];
  for(let lg of leagues){
    try{
      let u=`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard?dates=20261001-20261031`;
      let r=await fetch(PROXY+u);
      let d=await r.json();
      if(d.events) all=all.concat(d.events.map(ev=>({
        utcDate:ev.date,
        homeTeam:{name:ev.competitions[0].competitors[0].team.displayName, crest:ev.competitions[0].competitors[0].team.logo},
        awayTeam:{name:ev.competitions[0].competitors[1].team.displayName, crest:ev.competitions[0].competitors[1].team.logo},
        competition:{name:lg},
        isNat: lg.includes('fifa')||lg.includes('nations')
      })));
    }catch(err){}
  }
  renderGrouped(all);
  document.getElementById('status').textContent=`● ${all.length} مباراة (أندية + منتخبات) من ESPN`;
}

function renderGrouped(matches){
  // رتب حسب التاريخ
  matches.sort((a,b)=>new Date(a.utcDate)-new Date(b.utcDate));
  let byDay={};
  matches.forEach(m=>{
    let day=new Date(m.utcDate).toISOString().split('T')[0];
    if(!byDay[day]) byDay[day]=[];
    byDay[day].push(m);
  });

  let html='';
  Object.keys(byDay).sort().forEach(day=>{
    let dayMatches=byDay[day].slice(0,10); // كل نهار 10
    let dateObj=new Date(day);
    let dateStr=dateObj.toLocaleDateString('ar-MA',{weekday:'long', day:'numeric', month:'long'});
    html+=`<div class="day-group"><div class="day-title"><span>📅 ${dateStr}</span><span>${dayMatches.length} مباريات</span></div>`;
    dayMatches.forEach(m=>{
      let p=predictSimple(m.homeTeam.name,m.awayTeam.name);
      let isNat=m.isNat || isNationalTeam(m.homeTeam.name) || (m.competition && m.competition.name && m.competition.name.toLowerCase().includes('world'));
      html+=`<div class="card">
        <div class="team"><img src="${teamLogo(m.homeTeam)}" onerror="this.src='https://via.placeholder.com/28'"><b>${m.homeTeam.name}</b></div>
        <div class="vs-col">
          <div><span class="badge ${isNat?'badge-nat':'badge-club'}">${isNat?'منتخب':'نادي'}</span> <span style="font-size:10px;color:#888">${new Date(m.utcDate).toLocaleTimeString('ar-MA',{hour:'2-digit',minute:'2-digit'})}</span></div>
          <div class="score-pred">${p.score}</div>
          <div class="pred">${p.txt} • ${p.conf}%</div>
        </div>
        <div class="team" style="justify-content:flex-end"><b>${m.awayTeam.name}</b><img src="${teamLogo(m.awayTeam)}" onerror="this.src='https://via.placeholder.com/28'"></div>
      </div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('list').innerHTML=html || '<div style="padding:20px">ما كاينش ماتشات فهاد التاريخ</div>';
}

function loadToday(){
  let t=new Date().toISOString().split('T')[0];
  document.getElementById('from').value=t;
  document.getElementById('to').value='2026-10-31';
  loadOct();
}

loadOct();
</script>
</body>
</html>
