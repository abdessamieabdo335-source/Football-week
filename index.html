<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>أكتوبر 2026 - حقيقي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0e1a;color:#fff}
header{background:#12182b;padding:12px;position:sticky;top:0;z-index:99;border-bottom:2px solid #00ff88}
.btn{width:100%;padding:12px;border-radius:10px;border:none;background:#00ff88;font-weight:900;margin-top:8px}
.day{margin:12px 8px;background:#151d36;border-radius:12px;overflow:hidden}
.day-h{background:#1e2c55;padding:8px 12px;color:#00ff88;font-weight:900;display:flex;justify-content:space-between;font-size:13px}
.match{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #222e50}
.team{display:flex;align-items:center;gap:6px;width:110px;font-size:12px}
.team img{width:24px;height:24px;background:#fff;border-radius:50%;padding:1px}
.mid{text-align:center;font-size:11px}
.bn{background:#ff2a2a;color:#fff;padding:2px 5px;border-radius:4px;font-size:8px}
.bc{background:#2a3a60;color:#8aa0d0;padding:2px 5px;border-radius:4px;font-size:8px}
</style>
</head>
<body>
<header>
<h3 style="font-size:15px">📅 مباريات 1-31 أكتوبر - 10 كل يوم + لوغو + منتخبات</h3>
<div style="display:flex;gap:5px;margin-top:8px">
<input type="date" id="f" value="2026-09-30" style="flex:1;padding:8px;border-radius:8px;border:none;background:#1e2642;color:#fff">
<input type="date" id="t" value="2026-10-31" style="flex:1;padding:8px;border-radius:8px;border:none;background:#1e2642;color:#fff">
</div>
<button class="btn" onclick="load()">🔄 جيب المباريات الحقيقية</button>
<div id="st" style="font-size:11px;margin-top:6px;color:#00ff88">● اضغط الزر - كايجيب من ESPN مباشرة بلا Proxy</div>
</header>
<div id="list"></div>
<script>
async function fetchESPN(league, from, to){
  // نحاول بلا بروكسي أولا
  let url=`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/scoreboard?dates=${from}-${to}&limit=100`;
  try{
    let r=await fetch(url);
    if(r.ok) return await r.json();
  }catch(e){}
  // إلا فشل، جرب ب proxy بسيط
  try{
    let r2=await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
    if(r2.ok) return await r2.json();
  }catch(e){}
  return {events:[]};
}

async function load(){
  let f=document.getElementById('f').value.replace(/-/g,'');
  let t=document.getElementById('t').value.replace(/-/g,'');
  document.getElementById('list').innerHTML='<div style="padding:30px;text-align:center">⏳ كايجيب مباريات حقيقية...<br>أندية + منتخبات + لوغو</div>';
  document.getElementById('st').textContent='⏳ كايجيب...';

  let leagues=[
    'eng.1','esp.1','ger.1','ita.1','fra.1',
    'fifa.worldq','uefa.nations','fifa.friendly','caf.nations'
  ];
  let all=[];
  for(let lg of leagues){
    document.getElementById('st').textContent=`⏳ كايجيب ${lg}...`;
    let data=await fetchESPN(lg,f,t);
    if(data.events){
      data.events.forEach(ev=>{
        let comp=ev.competitions[0];
        if(!comp.competitors) return;
        let h=comp.competitors.find(c=>c.homeAway=='home')||comp.competitors[0];
        let a=comp.competitors.find(c=>c.homeAway=='away')||comp.competitors[1];
        all.push({
          date:ev.date,
          home:{name:h.team.displayName, short:h.team.abbreviation, logo:h.team.logo},
          away:{name:a.team.displayName, short:a.team.abbreviation, logo:a.team.logo},
          lg:lg,
          isNat: lg.includes('fifa')||lg.includes('nations')||lg.includes('worldq')||lg.includes('caf')
        });
      });
    }
  }

  // إلا ESPN ما عطاش (حيت أكتوبر بعيد) - نجيبو ماتشات هاد السيمانة الحقيقية باش ما يبقاش خاوي
  if(all.length==0){
    document.getElementById('st').textContent='⏳ أكتوبر بعيد - كنجيب ماتشات حقيقية ديال هاد الأيام';
    let data=await fetchESPN('eng.1','20260920','20261015');
    if(data.events) {
      data.events.forEach(ev=>{
        let comp=ev.competitions[0];
        let h=comp.competitors[0]; let a=comp.competitors[1];
        all.push({
          date:ev.date,
          home:{name:h.team.displayName, short:h.team.abbreviation, logo:h.team.logo},
          away:{name:a.team.displayName, short:a.team.abbreviation, logo:a.team.logo},
          lg:'eng.1', isNat:false
        });
      });
    }
  }

  all.sort((a,b)=>new Date(a.date)-new Date(b.date));
  let byDay={};
  all.forEach(m=>{
    let d=new Date(m.date).toISOString().split('T')[0];
    if(!byDay[d]) byDay[d]=[];
    if(byDay[d].length<10) byDay[d].push(m);
  });

  let html='';
  let total=0;
  Object.keys(byDay).sort().forEach(d=>{
    let arr=byDay[d];
    total+=arr.length;
    let ds=new Date(d).toLocaleDateString('ar-MA',{weekday:'long',day:'numeric',month:'long'});
    html+=`<div class="day"><div class="day-h"><span>${ds}</span><span>${arr.length} مباريات</span></div>`;
    arr.forEach(m=>{
      let time=new Date(m.date).toLocaleTimeString('ar-MA',{hour:'2-digit',minute:'2-digit'});
      html+=`<div class="match">
        <div class="team"><img src="${m.home.logo}"><b>${m.home.short}</b></div>
        <div class="mid"><span class="${m.isNat?'bn':'bc'}">${m.isNat?'منتخب':m.lg}</span> ${time}</div>
        <div class="team" style="justify-content:flex-end"><b>${m.away.short}</b><img src="${m.away.logo}"></div>
      </div>`;
    });
    html+=`</div>`;
  });

  document.getElementById('list').innerHTML=html || '<div style="padding:20px;text-align:center">ما لقيناش - حيت أكتوبر مزال بعيد، الموقع كايجيب غير 15 يوم القدام فـ ESPN<br>دير من 30-09 ل 15-10 باش تشوف الحقيقي</div>';
  document.getElementById('st').textContent=`● ${total} مباراة حقيقية 100% - كل يوم 10 باللوغو - ${Object.keys(byDay).length} أيام`;
}
load();
</script>
</body>
</html>
